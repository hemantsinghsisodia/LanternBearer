<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lantern Keeper</title>
    <style>
      :root {
        --bg: #070b14;
        --bg-soft: #0e1626;
        --gold: #f2c26b;
        --gold-dim: #a8873f;
        --text: #dfe6f3;
        --muted: #8593ad;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #121c33 0%, var(--bg) 70%); }
      #lk-frame { display: flex; flex-direction: column; width: min(100vw, calc((100vh - 38px) * 16 / 9)); }
      #lk-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--bg); }
      #lk-stage:fullscreen, #lk-stage:-webkit-full-screen { width: 100vw; height: 100vh; aspect-ratio: auto; }
      #unity-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: var(--bg); outline: none; }
      .lk-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at 50% 45%, #14213d 0%, var(--bg) 75%); }
      #lk-loading { z-index: 3; }
      #lk-start { z-index: 4; display: none; cursor: pointer; }
      .lk-flame { width: 14px; height: 22px; margin-bottom: 18px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(circle at 50% 70%, #fff2c6 0%, var(--gold) 55%, #d9822b 100%); box-shadow: 0 0 22px 8px rgba(242, 194, 107, 0.45); animation: lk-flicker 2.4s ease-in-out infinite; }
      @keyframes lk-flicker { 0%, 100% { transform: scale(1); opacity: 0.95; } 40% { transform: scale(1.08, 0.94); opacity: 1; } 70% { transform: scale(0.95, 1.06); opacity: 0.88; } }
      h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 56px); font-weight: normal; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 24px rgba(242, 194, 107, 0.35); }
      .lk-sub { margin: 0 0 28px; font-size: clamp(12px, 1.6vw, 17px); letter-spacing: 0.08em; color: var(--muted); }
      #lk-bar { width: min(52%, 360px); height: 6px; border-radius: 3px; background: #1a2540; overflow: hidden; }
      #lk-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width 0.15s linear; }
      #lk-pct { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: 0.1em; }
      #lk-click { padding: 12px 34px; border: 1px solid var(--gold-dim); border-radius: 3px; font-size: clamp(14px, 2vw, 22px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); background: rgba(242, 194, 107, 0.06); animation: lk-pulse 2s ease-in-out infinite; }
      #lk-start:hover #lk-click { background: rgba(242, 194, 107, 0.16); }
      @keyframes lk-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242, 194, 107, 0.0); } 50% { box-shadow: 0 0 18px 2px rgba(242, 194, 107, 0.28); } }
      .lk-hint { margin-top: 18px; font-size: 13px; color: var(--muted); letter-spacing: 0.06em; }
      #lk-footer { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-size: 14px; color: var(--muted); letter-spacing: 0.08em; }
      #lk-fullscreen { cursor: pointer; border: 1px solid #2a3858; background: var(--bg-soft); color: var(--text); font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 3px; letter-spacing: 0.08em; }
      #lk-fullscreen:hover { border-color: var(--gold-dim); color: var(--gold); }
      #lk-warning { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); z-index: 6; max-width: 90%; display: none; }
      #lk-warning div { padding: 8px 14px; margin-bottom: 6px; background: #2b2110; color: var(--gold); border: 1px solid var(--gold-dim); border-radius: 3px; font-size: 14px; }
      #lk-warning div.error { background: #3a1214; color: #ffb4b4; border-color: #8c2f33; }

      /* Touch devices (the page adds lk-touch to <body>): the frame fills the screen, no letterbox, no footer, no page scroll or zoom. */
      body.lk-touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; }
      body.lk-touch #lk-frame { width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
      body.lk-touch #lk-stage { flex: 1 1 auto; width: 100%; height: 100%; aspect-ratio: auto; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      body.lk-touch #lk-footer, body.lk-touch .lk-desktop-only { display: none; }

      /* Portrait on a touch device: cover the game with a rotate card (the page also pauses the game through LKWebBridge). */
      #lk-rotate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(7, 11, 20, 0.97); color: var(--gold); }
      @media (orientation: portrait) { body.lk-touch #lk-rotate { display: flex; } }
      #lk-rotate svg { width: 96px; height: 96px; margin-bottom: 22px; animation: lk-turn 2.6s ease-in-out infinite; }
      #lk-rotate p { margin: 0; font-size: 20px; letter-spacing: 0.1em; line-height: 1.4; }
      #lk-rotate .lk-rotate-sub { margin-top: 10px; font-size: 14px; color: var(--muted); letter-spacing: 0.06em; }
      @keyframes lk-turn { 0%, 15% { transform: rotate(0deg); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    </style>
  </head>
  <body>
    <div id="lk-frame">
      <div id="lk-stage">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
        <div id="lk-loading" class="lk-layer">
          <div class="lk-flame"></div>
          <h1>Lantern Keeper</h1>
          <p class="lk-sub">Light the beacons before the dark closes in</p>
          <div id="lk-bar"><div id="lk-bar-fill"></div></div>
          <div id="lk-pct">Loading 0%</div>
        </div>
        <div id="lk-start" class="lk-layer">
          <div class="lk-flame"></div>
          <h1>Lantern Keeper</h1>
          <p class="lk-sub">Light the beacons before the dark closes in</p>
          <div id="lk-click">Click to start</div>
          <div class="lk-hint">Sound on.<span class="lk-desktop-only"> Best in a desktop browser, with a keyboard.</span></div>
        </div>
        <div id="lk-rotate">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="19" y="6" width="26" height="52" rx="5"></rect>
            <line x1="28" y1="51" x2="36" y2="51"></line>
          </svg>
          <p>Rotate your phone to landscape</p>
          <p class="lk-rotate-sub">The game is paused until you do.</p>
        </div>
        <div id="lk-warning"></div>
      </div>
      <div id="lk-footer">
        <span>Lantern Keeper</span>
        <button id="lk-fullscreen" type="button">Fullscreen</button>
      </div>
    </div>
    <script>
      var stage = document.querySelector("#lk-stage");
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#lk-loading");
      var startLayer = document.querySelector("#lk-start");
      var barFill = document.querySelector("#lk-bar-fill");
      var pct = document.querySelector("#lk-pct");
      var fullscreenButton = document.querySelector("#lk-fullscreen");
      var unityInstanceRef = null;

      // Same check as Assets/Game/Plugins/WebGL/TouchDetect.jslib (LK_IsTouchDevice).
      var isTouchDevice = false;
      try {
        isTouchDevice = navigator.maxTouchPoints > 0 && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      } catch (e) { }
      if (isTouchDevice) {
        document.body.classList.add("lk-touch");
        document.querySelector("#lk-click").textContent = "Tap to start";
      }

      // Portrait on a touch device: the rotate card (CSS) covers the game, and the game is told so it can pause (LKWebBridge.SetPortrait).
      var lastPortrait = -1;
      function syncPortrait(force) {
        try {
          var portrait = isTouchDevice && window.matchMedia("(orientation: portrait)").matches ? 1 : 0;
          if (!unityInstanceRef || (!force && portrait === lastPortrait)) { return; }
          if (portrait === 0 && lastPortrait === -1) { lastPortrait = 0; return; }
          lastPortrait = portrait;
          unityInstanceRef.SendMessage("LKWebBridge", "SetPortrait", portrait);
        } catch (e) { }
      }
      window.addEventListener("orientationchange", function () { setTimeout(syncPortrait, 50); syncPortrait(); });
      window.addEventListener("resize", function () { syncPortrait(); });

      // Touch only: take the whole screen and lock to landscape. Each step is optional and may be refused (iPhone Safari has no element
      // fullscreen), so every call is wrapped and every rejected promise swallowed, as in unlockAudio.
      function enterLandscapeFullscreen() {
        function lockLandscape() {
          try {
            if (screen.orientation && screen.orientation.lock) {
              var l = screen.orientation.lock("landscape");
              if (l && l.catch) { l.catch(function () { }); }
            }
          } catch (e) { }
        }
        try {
          var request = stage.requestFullscreen || stage.webkitRequestFullscreen;
          if (request) {
            var r = request.call(stage);
            if (r && r.then) { r.then(lockLandscape, function () { }); } else { lockLandscape(); }
            return;
          }
        } catch (e) { }
        lockLandscape();
      }

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#lk-warning");
        function update() { banner.style.display = banner.children.length ? "block" : "none"; }
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type == "error") { div.className = "error"; }
        banner.appendChild(div);
        if (type != "error") {
          setTimeout(function () { if (div.parentNode) { banner.removeChild(div); } update(); }, 5000);
        }
        update();
      }

      // Unity resumes its audio context on the first click or key press. This click is that gesture, and the explicit
      // resume covers browsers that need it on the exact event.
      function unlockAudio() {
        try {
          var m = unityInstanceRef && unityInstanceRef.Module;
          // Development builds define an assertion getter on unexported Module names; merely reading Module.WEBAudio there
          // aborts the runtime. Only read it when it is a plain data property (release builds), never through a getter.
          var d = m && Object.getOwnPropertyDescriptor(m, "WEBAudio");
          var ctx = d && d.get === undefined && d.value && d.value.audioContext;
          if (ctx && ctx.state === "suspended") { var r = ctx.resume(); if (r && r.catch) { r.catch(function () { }); } }
        } catch (e) { }
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var tmp = new AC();
            // Close the probe context only after resume settles: closing it mid-resume rejects the resume promise
            // ("Closed before resume completed"), and Unity reports unhandled rejections as a fatal error.
            var closeTmp = function () { try { var c = tmp.close(); if (c && c.catch) { c.catch(function () { }); } } catch (e) { } };
            var p = tmp.state === "suspended" ? tmp.resume() : null;
            if (p && p.then) { p.then(closeTmp, closeTmp); } else { setTimeout(closeTmp, 500); }
          }
        } catch (e) { }
      }

      function toggleFullscreen() {
        if (unityInstanceRef) {
          unityInstanceRef.SetFullscreen(document.fullscreenElement ? 0 : 1);
        } else if (stage.requestFullscreen) {
          stage.requestFullscreen();
        }
      }
      fullscreenButton.onclick = toggleFullscreen;

      startLayer.onclick = function () {
        unlockAudio();
        if (isTouchDevice) { enterLandscapeFullscreen(); }
        startLayer.style.display = "none";
        canvas.focus();
      };

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "lk-stage",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var p = Math.round(progress * 100);
          barFill.style.width = p + "%";
          pct.textContent = "Loading " + p + "%";
        }).then(function (unityInstance) {
          unityInstanceRef = unityInstance;
          loading.style.display = "none";
          startLayer.style.display = "flex";
          syncPortrait();
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
          pct.textContent = "Could not start the game";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
